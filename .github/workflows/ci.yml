name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      # 1.100.2 CI FIX: fetch-depth: 0 (polna zgodovina, ~58 MiB) — unit testi
      # vsebujejo GIT-RESNICO past (ISSUE #4 §18/A: DESTINATIONS_DATA_AS_OF ≡
      # zadnji avtorski datum commita slovenia-data.ts). Privzeti shallow klon
      # (fetch-depth: 1) ima pritrjeno (grafted) korenino na pushanem commitu,
      # zato `git log -- <pot>` vrne KAR pushani commit (današnji datum) namesto
      # pravega zadnjega avtorja → past je lažno padala na VSAKEM pushu od VAL 7
      # (5d00161) naprej (rdeči CI skrit za lokalno zelenimi vrati). Test ima
      # tudi lastno varovalko: shallow klon → izrecen preskok z opozorilom.
      - name: 📥 Checkout (polna git zgodovina — git-resnica testi)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🗄️ Prepare Prisma client
        run: bunx prisma generate

      - name: 🔍 Lint
        run: bun run lint

      - name: 🔧 Type check
        run: bunx tsc --noEmit

      # CI-TESTS (1.27.0): 73+ unit testov v vsakem pushu/PR — prej je CI lahko
      # postal zelen tudi s pokvarjeno testno suito (testi so obstajali samo
      # lokalno). Testi so čisti (0 DB, 0 env) — tečejo v ~200 ms.
      - name: 🧪 Unit tests
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    # ─────────────────────────────────────────────────────────────────────
    # Faza 4f (2026-09): schema.prisma je prestavljena na postgresql
    # (Neon v produkciji) → CI Build job MORA testirati proti pravemu
    # Postgresu, ne več SQLite datoteki. Prejšnja nastavitev
    # (DATABASE_URL=file:./db/ci-test.db + `mkdir db`) je povzročila
    # fail CI #65 pri koraku "Prepare Prisma client & test DB" — Prisma
    # zavrne file: URL, ko je provider postgresql.
    #
    # Postgres service container: enaka arhitektura kot produkcija
    # (samo lokalna, ephemeral). `prisma db push` ustvari celo shemo,
    # `next build` pa teče s praznimi tabelami (strani so dynamic/empty-safe,
    # enako kot prej s praznim SQLite).
    # ─────────────────────────────────────────────────────────────────────
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/dsa_test"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # MIGR-HISTORY (1.27.0): drift vrata — prisma/migrations (postgres)
      # morajo ostati sinhroni s committed schema.prisma. Prej je seva
      # živela samo prek db push (brez zgodovine). --exit-code => rdeči CI,
      # če kdo spremeni shemo brez migracije.
      # Shadow = še prazen dsa_test (replay baseline vanj; db push sledi za njim
      # in je nato no-op oz. izenači morebitne mikrorazlike).
      - name: 📜 Migration drift check (migrations ⇄ schema)
        run: |
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://ci:ci@localhost:5432/dsa_test \
            --exit-code

      - name: 🗄️ Prepare Prisma client & test DB (Postgres)
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate

      - name: 🔨 Build
        run: bun run build
        env:
          # 1.48.2 CI FIX: vrednosti MORAJO biti ≥ 16 znakov — startup korak
          # config:secrets (1.33.0 placeholder-guard) zavrne krajše tudi v
          # CI, ker standalone build teče kot production (NODE_ENV). Do tega
          # popravka je bil CI tiho rdeč 27 h (16 commitov, od 4c2faf1).
          # Vrednosti so javne/naključne — CI je ephemeral, nič ne varujejo.
          NEXTAUTH_SECRET: "ci-smoke-nextauth-secret-0123456789"
          NEXTAUTH_URL: "http://localhost:3000"
          ADMIN_PASSWORD: "ci-smoke-admin-0123456789abcdef"
          STRIPE_SECRET_KEY: "sk_test_demo_placeholder"
          SMTP_HOST: "localhost"

      # ── CI-FUNC (1.31.0): FUNKCIONALNI DIM ─────────────────────────────
      # Prvič v zgodovini CI-ja se aplikacija DEJANSKO zažene: standalone
      # produkcijski strežnik (isti izpis kot `bun run start` na VPS/Docker,
      # Faza 4d) proti istemu Postgres service containerju.
      # functional-smoke.sh nato obliva ključne rute (SSR strani SL+EN,
      # robots/sitemap + vzorčne globoke strani, /api/health s startup
      # migracijami, /api/listings, 404) IN ponesreči tudi fallback pot
      # načrtovalnika: CI namerno NIMA AI ključev → POST /api/itinerary
      # sproži DETERMINISTIČNO fallback pot (ista produkcijska pot ob
      # odpovedi AI) — brez omrežne odvisnosti, ~5 s.
      # HOSTNAME=0.0.0.0: GH runner ima HOSTNAME env (docker id), ki bi ga
      # standalone server.js sicer poskusil vezati — eksplicitno prepišemo.
      - name: 🚀 Functional smoke + API e2e (zagon + rute + fallback + življenjski cikel)
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 \
            bun .next/standalone/server.js > server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          if ! bash scripts/ops/functional-smoke.sh http://127.0.0.1:3000; then
            echo "::error::Functional smoke neuspešen — server.log (zadnjih 60 vrstic):"
            tail -60 server.log || true
            exit 1
          fi
          # M10 (Issue #5 / T5-D): API-ravni ZLATA POT na istem strežniku.
          # MORA teči v TEM koraku — trap cleanup EXIT ubije strežnik ob
          # izhodu iz lupine tega koraka (ločen korak bi dobil mrtev strežnik).
          # CI nima AI ključev → parse sproži DETERMINISTIČNO rezervo (M1).
          if ! bash scripts/ops/ci-e2e.sh http://127.0.0.1:3000; then
            echo "::error::CI-E2E neuspešen — server.log (zadnjih 60 vrstic):"
            tail -60 server.log || true
            exit 1
          fi
        env:
          # 1.48.2 CI FIX: ≥ 16 znakov (config:secrets 1.33.0 guard) — glej
          # komentar pri Build koraku zgoraj.
          NEXTAUTH_SECRET: "ci-smoke-nextauth-secret-0123456789"
          NEXTAUTH_URL: "http://127.0.0.1:3000"
          ADMIN_PASSWORD: "ci-smoke-admin-0123456789abcdef"
          STRIPE_SECRET_KEY: "sk_test_demo_placeholder"
          SMTP_HOST: "localhost"
