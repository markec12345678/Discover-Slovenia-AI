name: Production Health Monitor

# PROD-MONITOR (1.31.0): samodejni nadzor OBEH produkcij — zapolni zadnjo
# vrzel elementa "startup migracije fail-open": /api/health sicer IZPOSTAVI
# spodletele startup korake (503 degraded, FAIL-MODE 1.27.0), a doslej
# nihče ni samodejno gledal. Zdaj GitHub Actions vsake 3 ure požene
# functional-smoke.sh --get-only (read-only, brez POST — ne porabi rate
# limit kvote uporabnikov) proti obema deploymentoma:
#
#   · Render  — PRIMARNA produkcija (README: od 2026-09-12, MONET valovi;
#               Docker, ~4 min; 19e-6 usklajeno z README/DEPLOYMENT)
#   · Vercel  — SEKUNDARNA (rate-limit okna — glej runbook)
#
# Kaj se preverja: /api/health (alarm če degraded/503 — spodletela startup
# migracija), SSR strani SL+EN, sitemap z pragom ≥ 650 URL (SEO regresija),
# 3 vzorčne globoke strani, /api/listings (živa DB povezljivost), 404.
#
# VERZIJSKA VRATA (ISSUE #7 / G-1, 1.115.1): --expect-version prejme verzijo
# iz package.json checkouta (main). Neujemanje (produkcija ≠ repo) = RDEČE —
# odkrito 2026-09-26: Render je bil 13 verzij za mainom (1.102.0), monitor
# pa tiho zelen, ker je preverjal SAMO health/SSR/SEO. Drift deploja je
# produkcijska resnica, ne kozmetika.
#
# ALARM: ob neuspehu scheduled run-a GitHub pošlje e-pošto lastniku repa
# (Settings → Notifications → Actions). Ročni zagon: workflow_dispatch.
# Zagon proti sebi: scripts/ops/functional-smoke.sh <url> --get-only
#
# Zavedanje: per-instance serverless posnetek — "degraded" enega merjenja
# pomeni "nekaj hladnih zagonov je padlo" (glej src/app/api/health/route.ts);
# prav to želimo videti zgodaj, še preden uporabniki poročajo.

on:
  schedule:
    - cron: "0 */3 * * *" # vsake 3 ure (UTC)
  workflow_dispatch:

jobs:
  vercel:
    name: Vercel (sekundarna — hitri hladni zagoni)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout (functional-smoke.sh + verzija)
        uses: actions/checkout@v4

      - name: 🩺 Health + funkcionalni dim (GET-only + verzija ≡ repo)
        run: bash scripts/ops/functional-smoke.sh https://i-feel-slovenia.vercel.app --get-only --ready-timeout 120 --expect-version "$(jq -r .version package.json)"

      - name: 🗺️ /pot embed SSR rezervacija (CLS razred regresije — 1.140.2)
        run: |
          # VRZELI VRAT, ki je pustila CLS 0.38 skozi (1.140.0): /pot poti
          # niso bile v NOBENEM samodejnem pregledu (Lighthouse vrata merijo
          # 5 kanonskih strani, smoke vzorči sitemap). Ta korak (vsake 3 h)
          # preveri, da strežniški HTML JAVNE testne poti vsebuje višinsko
          # rezervacijo zemljevida (h-[500px]) IN odsek »Načrt po dnevih« —
          # izginotje katerega koli = CLS regresija razreda 1.140.0
          # (odsek, ki se izriše šele ob hidrataciji, premakne vse pod sabo).
          # Testna pot bb183cd77d: anonimna, ustvarjena prek produkcijskega
          # API-ja (Task ID 14), samo bralna — obstane, dokler je DB živa.
          URL="https://i-feel-slovenia.vercel.app/pot/embed/bb183cd77d"
          fetch() { curl -sS -m 90 -o /tmp/pot-embed.html -w '%{http_code}' "$URL"; }
          CODE="$(fetch)"
          if [ "$CODE" != "200" ]; then
            echo "hladen zagon ($CODE) — ena ponovitev po 20 s (isti vzorec kot monitor-retry v smoke)"
            sleep 20
            CODE="$(fetch)"
          fi
          if [ "$CODE" != "200" ]; then
            echo "❌ /pot/embed vrnil $CODE (pričakovano 200)"
            exit 1
          fi
          if ! grep -qF 'h-[500px]' /tmp/pot-embed.html; then
            echo "❌ SSR višinska rezervacija zemljevida MANJKA (h-[500px]) — CLS regresija razreda 1.140.0!"
            exit 1
          fi
          if ! grep -qF 'Načrt po dnevih' /tmp/pot-embed.html; then
            echo "❌ Odsek zemljevida izginil iz SSR (»Načrt po dnevih«) — CLS regresija razreda 1.140.0!"
            exit 1
          fi
          echo "✅ /pot/embed: 200 + SSR višinska rezervacija (h-[500px]) + odsek zemljevida (Načrt po dnevih)"

  render:
    name: Render (PRIMARNA produkcija — hladni zagoni)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout (functional-smoke.sh + verzija)
        uses: actions/checkout@v4

      - name: 🩺 Health + funkcionalni dim (GET-only, retry za hladni zagon + verzija ≡ repo)
        run: bash scripts/ops/functional-smoke.sh https://i-feel-slovenia.onrender.com --get-only --ready-timeout 240 --expect-version "$(jq -r .version package.json)"
