name: AI Provider Smoke Test

# 1.14.0: ŽIVI test OBEH AI ključev iz GitHub runnerja (US regija —
# podprta, za razliko od razvojnega sandboxa):
#   · OPENROUTER_API_KEY — PRIMARNI provider (nex-agi/nex-n2.5-pro:free +
#     notranji fallback mini + JSON mode). Deluje iz vsake regije.
#   · GEMINI_API_KEY — SEKUNDARNI provider (chat + jsonMode + vision za
#     F8 slikovni vnos). Vision ostaja na Geminiju: OpenRouter :free
#     vision modeli so živo testirani in NEDELJUJEJO.
# Zagon: ROČNO (workflow_dispatch) prek GitHub UI, APIja ali skripte:
#   scripts/ops/github-workflow-run.sh
# Namen: dokaz, da ključa in VSE končne točke, ki jih uporablja
# src/lib/ai-client.ts, delujejo PRED deployom na Vercel/Render.
#
# Izkušnja iz prvega zagona (2026-09-15): gemini-3.6-flash je THINKING
# model — max_tokens 16 je porabil za notranje razmišljanje (finish_reason
# "length", completion_tokens 0). Zato so proračuni tu 512+ (v ai-client
# so tla 512 iz istega razloga).
#
# Ključa sta Actions secreta OPENROUTER_API_KEY + GEMINI_API_KEY —
# GitHub ju v logih samodejno maskira; v log se izpisujejo samo HTTP
# kode, usage in vsebina odgovora.

on:
  workflow_dispatch:

jobs:
  openrouter:
    name: OpenRouter (PRIMARNI) — živi klic
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: 🔑 Key info (veljavnost + free tier)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Secret OPENROUTER_API_KEY ni nastavljen (Settings → Secrets → Actions)"
            exit 1
          fi
          echo "→ GET /api/v1/key"
          HTTP_CODE=$(curl -sS -o /tmp/or-key.json -w "%{http_code}" -m 30 \
            "https://openrouter.ai/api/v1/key" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}")
          echo "← HTTP ${HTTP_CODE} · free_tier=$(jq -r '.data.is_free_tier // "?"' /tmp/or-key.json) · usage=$(jq -r '.data.usage // "?"' /tmp/or-key.json)"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::OpenRouter ključ ni veljaven (HTTP ${HTTP_CODE})"
            cat /tmp/or-key.json
            exit 1
          fi
          echo "::notice::OpenRouter ključ veljaven"

      - name: 💬 Test chat — primarni model nex-agi/nex-n2.5-pro:free
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          echo "→ POST /api/v1/chat/completions (nex-agi/nex-n2.5-pro:free)"
          HTTP_CODE=$(curl -sS -o /tmp/or-chat.json -w "%{http_code}" -m 90 \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://discover-slovenia.si" \
            -H "X-Title: Discover-Slovenia-AI" \
            -d '{
              "model": "nex-agi/nex-n2.5-pro:free",
              "messages": [{"role": "user", "content": "Odgovori samo z besedilom: SLOVENIJA-OPENROUTER-OK"}],
              "max_tokens": 512,
              "temperature": 0
            }')
          echo "← HTTP ${HTTP_CODE} · usage: $(jq -c '.usage.total_tokens // empty' /tmp/or-chat.json)"
          if [ "${HTTP_CODE}" = "200" ]; then
            CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/or-chat.json)
            echo "← vsebina: ${CONTENT}"
            if [ -z "${CONTENT}" ]; then
              echo "::error::Prazna vsebina odgovora"; exit 1
            fi
            echo "::notice::OpenRouter primarni model deluje (pot generacije)"
          elif [ "${HTTP_CODE}" = "429" ] && jq -r '.error.message // empty' /tmp/or-chat.json | grep -q "free-models-per-day"; then
            # DNEVNA MEJA free tierja (~50/dan brez kredita): ključ je VELJAVEN
            # (key-info korak zgoraj je 200), model pa je bil živo dokazan
            # (2026-09-15: "Dnevni pobeg na Bled" — čist JSON v slovenščini).
            # To ni napaka namestitve — naročena arhitektura TOČNO tu pase:
            # "ostala dva, ko routeru zmanjka" (Gemini v produkciji).
            echo "::warning::Dnevna meja free tierja dosežena — ključ veljaven (key-info 200), veriga pade na Gemini. Dodaj $10 kredita za 1000/dan ko raste promet."
          else
            echo "::error::OpenRouter chat odgovoril s HTTP ${HTTP_CODE}"
            jq -r '.error.message // .' /tmp/or-chat.json | head -5
            exit 1
          fi

      - name: 🧾 Test jsonMode response_format (pot generacije JSON)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          echo "→ POST chat/completions z response_format json_object"
          HTTP_CODE=$(curl -sS -o /tmp/or-json.json -w "%{http_code}" -m 90 \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "nex-agi/nex-n2.5-pro:free",
              "messages": [
                {"role": "system", "content": "Odgovarjaj SAMO z veljavnim JSON."},
                {"role": "user", "content": "Vrni JSON: {\"status\":\"ok\",\"drzava\":\"Slovenija\"}"}
              ],
              "response_format": {"type": "json_object"},
              "max_tokens": 512,
              "temperature": 0
            }')
          echo "← HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "429" ] && jq -r '.error.message // empty' /tmp/or-json.json | grep -q "free-models-per-day"; then
            echo "::warning::jsonMode: dnevna meja free tierja — JSON podprtost je bila živo dokazana (2026-09-15)."
          elif [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::OpenRouter jsonMode odgovoril s HTTP ${HTTP_CODE}"
            jq -r '.error.message // .' /tmp/or-json.json | head -5
            exit 1
          else
            CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/or-json.json)
            echo "← vsebina: ${CONTENT}"
            echo "${CONTENT}" | jq -e '.status' > /dev/null || {
              echo "::error::jsonMode: odgovor ni veljaven JSON"; exit 1; }
            echo "::notice::OpenRouter jsonMode deluje — generacija JSON varna"
          fi

      # INFORMACIJSKA sonda (ne podre joba): notranji fallback model.
      # Free tier je prehoden (503/429) — če odpovedani, veriga gre še na
      # gemini (spodaj), zato je to opozorilo, ne napaka.
      - name: 🛟 Sonda notranji fallback mini (informacijsko)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/or-mini.json -w "%{http_code}" -m 90 \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "nex-agi/nex-n2.5-mini:free",
              "messages": [{"role": "user", "content": "Odgovori samo z besedilom: MINI-OK"}],
              "max_tokens": 512,
              "temperature": 0
            }')
          echo "← HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" == "200" ] && [ -n "$(jq -r '.choices[0].message.content // empty' /tmp/or-mini.json)" ]; then
            echo "::notice::Notranji fallback (mini) deluje"
          else
            echo "::warning::Notranji fallback trenutno ne odgovarja (prehodno) — zunanja veriga prevzame"
          fi

  gemini:
    name: Gemini (SEKUNDARNI) — živi klic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 💬 Test chat completion (generacijska pot)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Secret GEMINI_API_KEY ni nastavljen (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "→ POST /v1beta/openai/chat/completions (model: gemini-3.6-flash)"
          HTTP_CODE=$(curl -sS -o /tmp/gemini-smoke.json -w "%{http_code}" -m 45 \
            "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Authorization: Bearer ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gemini-3.6-flash",
              "messages": [{"role": "user", "content": "Odgovori samo z besedilom: SLOVENIJA-OK"}],
              "max_tokens": 512,
              "temperature": 0
            }')
          echo "← HTTP ${HTTP_CODE}"
          echo "← usage: $(jq -c '.usage // empty' /tmp/gemini-smoke.json)"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Gemini API odgovoril s HTTP ${HTTP_CODE}"
            cat /tmp/gemini-smoke.json
            exit 1
          fi
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/gemini-smoke.json)
          echo "← vsebina: ${CONTENT}"
          if [ -z "${CONTENT}" ]; then
            echo "::error::Prazna vsebina odgovora"
            cat /tmp/gemini-smoke.json
            exit 1
          fi
          echo "::notice::Gemini chat completion deluje (pot generacije itinererjev)"

      - name: 🧾 Test jsonMode response_format (pot generacije JSON)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          echo "→ POST chat/completions z response_format json_object"
          HTTP_CODE=$(curl -sS -o /tmp/gemini-json.json -w "%{http_code}" -m 45 \
            "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Authorization: Bearer ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gemini-3.6-flash",
              "messages": [
                {"role": "system", "content": "Odgovarjaj SAMO z veljavnim JSON."},
                {"role": "user", "content": "Vrni JSON: {\"status\":\"ok\",\"drzava\":\"Slovenija\"}"}
              ],
              "response_format": {"type": "json_object"},
              "max_tokens": 512,
              "temperature": 0
            }')
          echo "← HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Gemini jsonMode odgovoril s HTTP ${HTTP_CODE} — generacijske rute bi padle na fallback!"
            cat /tmp/gemini-json.json
            exit 1
          fi
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/gemini-json.json)
          echo "← vsebina: ${CONTENT}"
          if [ -z "${CONTENT}" ]; then
            echo "::error::jsonMode: prazna vsebina"
            exit 1
          fi
          echo "${CONTENT}" | jq -e '.status' > /dev/null || {
            echo "::error::jsonMode: odgovor ni veljaven JSON objekt"; exit 1; }
          echo "::notice::Gemini jsonMode (response_format) deluje — generacija JSON varna"

      - name: 🖼️ Test vision image_url (pot F8 slikovnega vnosa)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          # 1×1 PNG, generiran na mestu (brez zaupanja v prilepljen base64)
          PIXEL=$(python3 -c '
          import base64, zlib, struct
          def chunk(t, d):
              c = t + d
              return struct.pack(">I", len(d)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00"))
                 + chunk(b"IEND", b""))
          print(base64.b64encode(png).decode())
          ')
          echo "→ POST chat/completions z image_url delom"
          HTTP_CODE=$(curl -sS -o /tmp/gemini-vision.json -w "%{http_code}" -m 45 \
            "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Authorization: Bearer ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gemini-3.6-flash\",
              \"messages\": [{
                \"role\": \"user\",
                \"content\": [
                  {\"type\": \"text\", \"text\": \"Odgovori samo z besedilom: VISION-OK\"},
                  {\"type\": \"image_url\", \"image_url\": {\"url\": \"data:image/png;base64,${PIXEL}\"}}
                ]
              }],
              \"max_tokens\": 512
            }")
          echo "← HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Gemini vision odgovoril s HTTP ${HTTP_CODE}"
            cat /tmp/gemini-vision.json
            exit 1
          fi
          echo "::notice::Gemini vision (image_url) deluje — F8 slikovni vnos ima produkcijsko pot"

      # INFORMACIJSKA sonda (ne podre joba): ali compat plast sprejema
      # reasoning_effort? Če DA, ga lahko prihodnje dodamo v ai-client za
      # še manjše thinking proračune; če NE, ostajamo pri tlacet 512.
      - name: 🔬 Sonda reasoning_effort (informacijsko)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/gemini-reasoning.json -w "%{http_code}" -m 45 \
            "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Authorization: Bearer ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gemini-3.6-flash",
              "messages": [{"role": "user", "content": "Reply: OK"}],
              "reasoning_effort": "low",
              "max_tokens": 512
            }')
          echo "← HTTP ${HTTP_CODE} (reasoning_effort: low)"
          if [ "${HTTP_CODE}" == "200" ]; then
            echo "::notice::reasoning_effort je PODPRT — kandidat za optimizacijo ai-client"
          else
            echo "::warning::reasoning_effort NI podprt — ai-client ostaja pri tlacet 512 žetonov"
          fi
