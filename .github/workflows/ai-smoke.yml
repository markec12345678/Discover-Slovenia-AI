name: AI Vision Smoke Test

# ISSUE #9 (ZERO-AI / deterministic-first): jedro platforme je 100 %
# deterministično (0 AI ključev, 0 LLM klicev — CI funkcijski testi
# preverjajo ravno to). AI ostaja IZKLJUČNO kot OPCIJSKA vizija
# (razumevanje slik — "Začni s sliko" + rezervacijski screenshot),
# strežena po GEMINI_API_KEY prek OpenAI-compat REST končne točke
# (navaden fetch — paket `openai` je odstranjen iz odvisnosti).
#
# Ta workflow je ŽIVI test tega (edinega) preostalega AI ključa iz
# GitHub runnerja (US regija — podprta, za razliko od razvojnega
# sandboxa, ki je geo-blokiran). Zagon: ROČNO (workflow_dispatch) ali
# TEDENSKO (PO 07:00 UTC — ~1 klic/teden, zanemarljivo za free tier).
# Namen: rotiran/iztekel GEMINI_API_KEY v Vercel/Render env ne more
# živeti TIHO — rdeči run = e-poštni alarm lastniku (slika-vnos bi
# pošteno padel na 502, ostalo deluje normalno).
#
# ISSUE #9: OPENROUTER_API_KEY + PUTER_AUTH_TOKEN jobi/sonde so
# ODSTRANJENI (tekstovna veriga ne obstaja več). Secret
# OPENROUTER_API_KEY v GitHubu lahko lastnik izbriše (Settings →
# Secrets → Actions).

on:
  schedule:
    # PO 07:00 UTC = PO 09:00 po slovenskem času (GitHub Actions ima
    # sicer ~15 min jitter na cron).
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  gemini-vision:
    name: Gemini (OPCIJSKA vizija) — živi klic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🖼️ Test vision image_url (edina AI pot po Issue #9)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Secret GEMINI_API_KEY ni nastavljen (Settings → Secrets and variables → Actions). Brez njega slikovni vnos pošteno vrača 502 — jedro platforme deluje normalno (deterministično)."
            exit 1
          fi
          sleep 12  # RPM premor (free tier) — živo ugotovitev run #3
          # 1×1 PNG, generiran na mestu (brez zaupanja v prilepljen base64)
          PIXEL=$(python3 -c '
          import base64, zlib, struct
          def chunk(t, d):
              c = t + d
              return struct.pack(">I", len(d)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00"))
                 + chunk(b"IEND", b""))
          print(base64.b64encode(png).decode())
          ')
          echo "→ POST chat/completions z image_url delom (gemini-3.6-flash, reasoning_effort low — isti parametri kot ai-client)"
          HTTP_CODE=$(curl -sS -o /tmp/gemini-vision.json -w "%{http_code}" -m 45 \
            "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Authorization: Bearer ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gemini-3.6-flash\",
              \"messages\": [{
                \"role\": \"user\",
                \"content\": [
                  {\"type\": \"text\", \"text\": \"Odgovori samo z besedilom: VISION-OK\"},
                  {\"type\": \"image_url\", \"image_url\": {\"url\": \"data:image/png;base64,${PIXEL}\"}}
                ]
              }],
              \"max_tokens\": 512,
              \"reasoning_effort\": \"low\"
            }")
          echo "← HTTP ${HTTP_CODE}"
          echo "← usage: $(jq -c '.usage // empty' /tmp/gemini-vision.json)"
          # 429 = RPM free tier: 1 ponovitev po 20 s; če še vedno 429 →
          # opozorilo (ne napaka — vision je bil živo zelen v zgodovinskih
          # zagonih; ključ je dokazan z vsakim 200).
          if [ "${HTTP_CODE}" = "429" ]; then
            echo "::warning::vision 429 (RPM) — ponovitev po 20 s"
            sleep 20
            HTTP_CODE=$(curl -sS -o /tmp/gemini-vision.json -w "%{http_code}" -m 45 \
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
              -H "Authorization: Bearer ${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"gemini-3.6-flash\",
                \"messages\": [{
                  \"role\": \"user\",
                  \"content\": [
                    {\"type\": \"text\", \"text\": \"Odgovori samo z besedilom: VISION-OK\"},
                    {\"type\": \"image_url\", \"image_url\": {\"url\": \"data:image/png;base64,${PIXEL}\"}}
                  ]
                }],
                \"max_tokens\": 512,
                \"reasoning_effort\": \"low\"
              }")
            echo "← retry HTTP ${HTTP_CODE}"
          fi
          if [ "${HTTP_CODE}" = "429" ]; then
            echo "::warning::vision še vedno 429 (RPM) — prostovoljna plast; jedro deluje deterministično."
            exit 0
          fi
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Gemini vision odgovoril s HTTP ${HTTP_CODE} — slikovni vnos bi padel na 502 (jedro neprizadeto)"
            cat /tmp/gemini-vision.json
            exit 1
          fi
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/gemini-vision.json)
          echo "← vsebina: ${CONTENT}"
          if [ -z "${CONTENT}" ]; then
            echo "::error::Prazna vsebina vision odgovora"
            cat /tmp/gemini-vision.json
            exit 1
          fi
          echo "::notice::Gemini vision (image_url) deluje — slikovni vnos ima produkcijsko pot (Issue #9: edini AI ostanek)"
